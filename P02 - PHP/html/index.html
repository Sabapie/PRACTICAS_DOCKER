<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de inscripción</title>
    <link rel="stylesheet" href="estilos.css">
</head>

<body>

    <div class="contenedor">

        <h1>Formulario de inscripción de actividades</h1>

        <p class="descripcion">
            Introduce tus preferencias:
        </p>

        <form action="procesar.php" method="POST">

            <div class="grupo">
                <label for="nombre">Nombre y apellidos:</label>
                <input type="text" id="nombre" name="nombre" required>
            </div>

            <div class="grupo">
                <label for="correo">Correo electrónico:</label>
                <input type="email" id="correo" name="correo" required>
            </div>

            <div class="grupo">
                <label>Selecciona un horario:</label>

                <div class="seleccion-turno">
                    <label class="opcion-turno">
                        <input type="radio" name="turno" value="Mañana" required>
                        Mañana
                    </label>

                    <label class="opcion-turno">
                        <input type="radio" name="turno" value="Tarde">
                        Tarde
                    </label>
                </div>
            </div>

            <div class="grupo">
                <label for="actividad">Actividad:</label>
                <select id="actividad" name="actividad" required>
                    <option value="">Selecciona la actividad</option>
                    <option value="1">Robótica</option>
                    <option value="2">Desarrollo de videojuegos</option>
                    <option value="3">Ciberseguridad</option>
                    <option value="4">Diseño e impresión 3D</option>
                </select>
            </div>

            <div class="opciones">

                <p class="titulo-opciones">
                    Recursos para las prácticas:
                </p>

                <label class="opcion" for="portatil">
                    <input
                        type="checkbox"
                        id="portatil"
                        name="portatil"
                        value="true"
                    >
                    Dispongo de ordenador portátil propio.
                </label>
                
                <label class="opcion" for="auriculares">
                    <input
                        type="checkbox"
                        id="auriculares"
                        name="auriculares"
                        value="true"
                    >
                    Dispongo de auriculares propios.
                </label>

                <label class="opcion" for="material">
                    <input
                        type="checkbox"
                        id="material"
                        name="material"
                        value="true"
                    >
                    Dispongo de material de escritura propio.
                </label>

            </div>

            <div class="botones">
                <button type="submit" class="enviar">
                    Enviar formulario
                </button>

                <button type="reset" class="limpiar">
                    Limpiar
                </button>
            </div>

        </form>

        <p class="nota">
            Los datos introducidos se enviarán al servidor mediante
            el método POST.
        </p>

    </div>

</body>
</html>
